# Connection Analysis Mapping Java example

[analysis]
language = "java"
include_tests = false
follow_symlinks = false
max_file_bytes = 2000000
include = ["**/*.java"]
exclude = [
  ".git/**",
  ".connection-map/**",
  "**/__pycache__/**",
  "**/build/**",
  "**/dist/**",
  "**/.gradle/**",
  "**/target/**",
]
test_patterns = ["tests/**", "test/**", "**/*Test.java", "**/Test*.java"]
generated = []
